    <script>
      // Clean up any stale service workers from prior testing
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        }).catch(function() {});
      }

      // If loaded uncompiled on GitHub Pages (Deploy from branch -> root), auto-redirect to pre-built /docs/
      if (window.location.hostname.endsWith('github.io') && !window.location.pathname.includes('/docs/')) {
        var rawSrc = document.querySelector('script[src*="/src/main.tsx"]');
        if (rawSrc) {
          var p = window.location.pathname;
          if (!p.endsWith('/')) p += '/';
          window.location.replace(p + 'docs/' + window.location.search + window.location.hash);
        }
      }
    </script>
