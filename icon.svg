<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield/Card with Safe Margins -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="4" />

  <!-- Network Interconnection Grid Lines -->
  <g stroke="#38bdf8" stroke-width="6" stroke-opacity="0.6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="256" y1="120" x2="140" y2="210" />
    <line x1="256" y1="120" x2="372" y2="210" />
    <line x1="140" y1="210" x2="180" y2="360" />
    <line x1="372" y1="210" x2="332" y2="360" />
    <line x1="180" y1="360" x2="332" y2="360" />
    <line x1="256" y1="120" x2="256" y2="256" stroke="#34d399" stroke-width="5" />
    <line x1="140" y1="210" x2="256" y2="256" stroke="#34d399" stroke-width="5" />
    <line x1="372" y1="210" x2="256" y2="256" stroke="#34d399" stroke-width="5" />
    <line x1="180" y1="360" x2="256" y2="256" stroke="#34d399" stroke-width="5" />
    <line x1="332" y1="360" x2="256" y2="256" stroke="#34d399" stroke-width="5" />
  </g>

  <!-- Packet Pulses on Links -->
  <circle cx="198" cy="165" r="5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="314" cy="165" r="5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="256" cy="360" r="5" fill="#34d399" filter="url(#glow)" />

  <!-- Network Nodes -->
  <!-- Top Router Node -->
  <circle cx="256" cy="120" r="32" fill="url(#cyanGrad)" filter="url(#glow)" />
  <circle cx="256" cy="120" r="16" fill="#ffffff" />

  <!-- Left Switch Node -->
  <rect x="110" y="180" width="60" height="60" rx="14" fill="url(#cyanGrad)" />
  <circle cx="140" cy="210" r="14" fill="#ffffff" />

  <!-- Right Firewall Node -->
  <polygon points="372,180 402,225 342,225" fill="url(#amberGrad)" />
  <circle cx="372" cy="214" r="12" fill="#ffffff" />

  <!-- Bottom Left Host Node -->
  <rect x="154" y="334" width="52" height="52" rx="10" fill="url(#emeraldGrad)" />
  <circle cx="180" cy="360" r="10" fill="#ffffff" />

  <!-- Bottom Right Host Node -->
  <rect x="306" y="334" width="52" height="52" rx="10" fill="url(#emeraldGrad)" />
  <circle cx="332" cy="360" r="10" fill="#ffffff" />

  <!-- Central Core / Gateway Hub -->
  <circle cx="256" cy="256" r="44" fill="#0f172a" stroke="#38bdf8" stroke-width="8" />
  <circle cx="256" cy="256" r="28" fill="url(#cyanGrad)" filter="url(#glow)" />
  <path d="M 256 242 L 260 252 L 270 256 L 260 260 L 256 270 L 252 260 L 242 256 L 252 252 Z" fill="#ffffff" />

  <!-- Branding text at bottom -->
  <text x="256" y="445" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="3">ENSv1</text>
  <text x="256" y="475" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="1">EXPLORE NETWORK SIMULATOR</text>
</svg>
